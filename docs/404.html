<div class="lp" style="width: 100%; min-height: 900px; background: var(--bg); color: var(--ink); font-family: 'Rubik', system-ui, sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden; display: flex; flex-direction: column">

  <header style="width: 100%; max-width: 1160px; margin: 0 auto; box-sizing: border-box; padding: 20px clamp(16px, 4vw, 48px); display: flex; align-items: center">
    <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 20px">
      <span class="pet-bob" aria-hidden="true" style="position: relative; width: 32px; height: 32px; background: var(--accent); display: block"><i class="eye" style="position: absolute; background: var(--face); left: 26%; top: 36%; width: 12%; height: 12%"></i><i class="eye" style="position: absolute; background: var(--face); left: 62%; top: 36%; width: 12%; height: 12%"></i><i style="position: absolute; background: var(--cheek); left: 8%; top: 58%; width: 12%; height: 7%"></i><i style="position: absolute; background: var(--cheek); left: 80%; top: 58%; width: 12%; height: 7%"></i><i style="position: absolute; background: var(--face); left: 40%; top: 64%; width: 22%; height: 6%"></i></span>
      Luna

  </header>

  <main style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px 96px">
    <div class="clouds" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">

    </div>
    <div class="stagger" style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; max-width: 480px">
      <span aria-hidden="true" style="position: relative; display: block"><span class="zzz" style="right: -20px; top: -8px; font-size: 18px">z</span><span class="zzz" style="right: -20px; top: -8px; font-size: 22px">z</span><span class="zzz" style="right: -20px; top: -8px; font-size: 26px">Z</span><span class="pet-sleep" style="position: relative; width: 96px; height: 96px; background: var(--asleep); display: block"><i style="position: absolute; background: var(--face); left: 22%; top: 42%; width: 18%; height: 5%"></i><i style="position: absolute; background: var(--face); left: 60%; top: 42%; width: 18%; height: 5%"></i><i style="position: absolute; background: var(--face); left: 42%; top: 64%; width: 16%; height: 5%"></i></span></span>

      <p style="margin: 0; font-size: 18px; color: var(--mute)">This page doesn't exist, or it moved. Luna is fine, it's just napping.</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
        <a href="index.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; background: var(--pri); color: var(--onp); text-decoration: none; font-weight: 600; border-radius: 12px">Go to the home page</a>
